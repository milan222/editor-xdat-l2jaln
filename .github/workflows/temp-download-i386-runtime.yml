name: Temp Download i386 Runtime

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and extract i386 runtime libraries
        shell: bash
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          mkdir -p debs runtime
          cd debs
          apt-get download libc6:i386 libgcc-s1:i386 zlib1g:i386
          cd ..
          for deb in debs/*.deb; do dpkg-deb -x "$deb" runtime; done
          find runtime -type f -printf '%p %s bytes\n'
          tar -C runtime -cJf i386-runtime.tar.xz .
          sha256sum i386-runtime.tar.xz | tee SHA256SUMS.txt
      - name: Upload i386 runtime
        uses: actions/upload-artifact@v4
        with:
          name: i386-linux-runtime
          path: |
            i386-runtime.tar.xz
            SHA256SUMS.txt
          if-no-files-found: error
