name: Temp Download QEMU i386 Static

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Download qemu-user-static
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p debs out
          cd debs
          apt-get download qemu-user-static
          cd ..
          for deb in debs/*.deb; do dpkg-deb -x "$deb" out; done
          find out -type f -name 'qemu-i386-static' -printf '%p %s bytes\n'
          cp "$(find out -type f -name qemu-i386-static | head -1)" ./qemu-i386-static
          chmod +x qemu-i386-static
          sha256sum qemu-i386-static | tee SHA256SUMS.txt
      - name: Upload qemu i386
        uses: actions/upload-artifact@v4
        with:
          name: qemu-i386-static
          path: |
            qemu-i386-static
            SHA256SUMS.txt
          if-no-files-found: error
