name: Temp Build Patched Wibo

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wibo
        uses: actions/checkout@v4
        with:
          repository: decompals/wibo
          ref: 1.2.0
          path: wibo
      - name: Patch harmless missing WinMM calls
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wibo/src/modules.cpp')
          s=p.read_text()
          marker='wibo: call reached missing import'
          pos=s.find(marker)
          if pos < 0:
              raise SystemExit('missing-import marker not found')
          abort_pos=s.find('abort();',pos)
          if abort_pos < 0:
              raise SystemExit('stub abort not found after marker')
          s=s[:abort_pos]+'return;'+s[abort_pos+len('abort();'):]
          p.write_text(s)
          print(s[max(0,pos-300):abort_pos+100])
          PY
      - name: Build static x86_64
        shell: bash
        run: |
          set -o pipefail
          cd wibo
          docker build --target export --build-arg BUILD_TYPE=release --build-arg WIBO_VERSION=1.2.0-h5 -o ../dist . 2>&1 | tee ../wibo-build.log
      - name: Upload patched wibo and log
        uses: actions/upload-artifact@v4
        with:
          name: wibo-h5-patched
          path: |
            dist/wibo
            wibo-build.log
          if-no-files-found: error
