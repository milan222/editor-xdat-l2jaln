name: Temp Build Patched Wibo

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wibo
        uses: actions/checkout@v4
        with:
          repository: decompals/wibo
          ref: 1.2.0
          path: wibo
      - name: Patch harmless missing WinMM calls
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('wibo/src/modules.cpp')
          s=p.read_text()
          marker='wibo: call reached missing import'
          pos=s.find(marker)
          if pos < 0:
              raise SystemExit('missing-import marker not found')
          start=s.rfind('template <size_t Index>',0,pos)
          end=s.find('\n}',pos)+2
          block=s[start:end]
          print(block)
          patched=block.replace('abort();','return;')
          if patched == block:
              raise SystemExit('abort call not found in stubThunk block')
          s=s[:start]+patched+s[end:]
          p.write_text(s)
          PY
      - name: Build static x86_64
        shell: bash
        run: |
          cd wibo
          docker build --target export --build-arg BUILD_TYPE=release --build-arg WIBO_VERSION=1.2.0-h5 -o ../dist .
      - name: Upload patched wibo
        uses: actions/upload-artifact@v4
        with:
          name: wibo-h5-patched
          path: dist/wibo
          if-no-files-found: error
