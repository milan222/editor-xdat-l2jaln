name: Temp Build UE2 UCC

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ucc:
    runs-on: windows-latest
    steps:
      - name: Checkout Unreal2004 source
        uses: actions/checkout@v4
        with:
          repository: jmarshall23/Unreal2004
          ref: 07249c526830e8ffa4e6a3b133c92896f44a686a
          path: unreal
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Retarget legacy projects
        shell: pwsh
        run: |
          Get-ChildItem unreal -Recurse -Filter *.vcxproj | ForEach-Object {
            $p = $_.FullName
            $s = Get-Content $p -Raw
            $s = $s -replace '<PlatformToolset>v100</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>'
            $s = $s -replace '<WindowsTargetPlatformVersion>[^<]+</WindowsTargetPlatformVersion>', '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>'
            $s = $s -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>'
            $s = $s -replace '<WarningLevel>Level4</WarningLevel>', '<WarningLevel>Level3</WarningLevel>'
            Set-Content -Path $p -Value $s -Encoding UTF8
          }
      - name: Build UCC and capture log
        shell: cmd
        continue-on-error: true
        run: msbuild "unreal\UT2 Code.sln" /t:UCC /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningAsError=false /p:WarningsAsErrors= /fl /flp:logfile=ucc-build.log;verbosity=diagnostic
      - name: Find outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path unreal -Filter UCC.exe -Recurse | Format-Table FullName,Length
          if (Test-Path ucc-build.log) { Get-Content ucc-build.log -Tail 300 }
      - name: Upload UCC and log
        uses: actions/upload-artifact@v4
        with:
          name: ue2-ucc-build
          path: |
            unreal/System/UCC.exe
            unreal/UCC/Release/UCC.exe
            ucc-build.log
          if-no-files-found: warn
