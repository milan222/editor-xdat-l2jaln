name: Temp Build Patched Wibo

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wibo
        uses: actions/checkout@v4
        with:
          repository: decompals/wibo
          ref: 1.2.0
          path: wibo
      - name: Implement WinMM timing functions
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          entry = Path('wibo/src/entry.h')
          e = entry.read_text()
          old_sig = 'void CDECL stubBase(SIZE_T index);'
          if old_sig not in e:
              raise SystemExit('entry signature not found')
          entry.write_text(e.replace(old_sig, 'DWORD CDECL stubBase(SIZE_T index);'))
          p = Path('wibo/src/modules.cpp')
          s = p.read_text()
          if '#include <chrono>' not in s:
              s = s.replace('#include <climits>', '#include <climits>\\n#include <chrono>')
          pattern = r'void stubBase\(SIZE_T index\) \{.*?\n\}'
          lines = [
              'DWORD stubBase(SIZE_T index) {',
              '    const char *func = stubFuncNames[index].empty() ? "<unknown>" : stubFuncNames[index].c_str();',
              '    const char *dll = stubDlls[index].empty() ? "<unknown>" : stubDlls[index].c_str();',
              '    if (std::strcmp(func, "timeGetTime") == 0) {',
              '        using namespace std::chrono;',
              '        return static_cast<DWORD>(duration_cast<milliseconds>(steady_clock::now().time_since_epoch()).count());',
              '    }',
              '    if (std::strcmp(func, "timeBeginPeriod") == 0 || std::strcmp(func, "timeEndPeriod") == 0) {',
              '        return 0;',
              '    }',
              '    fprintf(stderr, "wibo: call reached missing import %s from %s\\\\n", func, dll);',
              '    fflush(stderr);',
              '    abort();',
              '}'
          ]
          replacement = '\\n'.join(lines)
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'stubBase replacement count={count}')
          p.write_text(s2)
          PY
      - name: Build static x86_64
        shell: bash
        run: |
          set -o pipefail
          cd wibo
          docker build --target export --build-arg BUILD_TYPE=release --build-arg WIBO_VERSION=1.2.0-h5-winmm -o ../dist . 2>&1 | tee ../wibo-build.log
      - name: Upload patched wibo and log
        uses: actions/upload-artifact@v4
        with:
          name: wibo-h5-winmm
          path: |
            dist/wibo
            wibo-build.log
          if-no-files-found: error
