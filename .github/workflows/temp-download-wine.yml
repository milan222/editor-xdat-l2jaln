name: Temp Download Portable Wine Multilib

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download portable Wine amd64 multilib
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          URL='https://github.com/Kron4ek/Wine-Builds/releases/download/10.0/wine-10.0-amd64.tar.xz'
          curl -L --fail --retry 5 --retry-delay 3 -o out/wine-10.0-amd64.tar.xz "$URL"
          ls -lh out/wine-10.0-amd64.tar.xz
          sha256sum out/wine-10.0-amd64.tar.xz | tee out/SHA256SUMS.txt
      - name: Upload portable Wine
        uses: actions/upload-artifact@v4
        with:
          name: wine-amd64-multilib-portable
          path: out/*
          if-no-files-found: error
