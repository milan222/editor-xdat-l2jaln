name: Temp Download H5 Compiler

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download public H5 compiler archive
        shell: bash
        continue-on-error: true
        run: |
          set -uxo pipefail
          URL='https://cloud.mail.ru/public/6ke2/7SxPnkT7F'
          mkdir -p out diagnostics
          curl -k -L --compressed \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -c diagnostics/cookies.txt -b diagnostics/cookies.txt \
            -D diagnostics/headers.txt -o diagnostics/page.html \
            -w '%{http_code}\n%{url_effective}\n' "$URL" | tee diagnostics/status.txt
          wc -c diagnostics/page.html || true
          head -c 500 diagnostics/page.html || true
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          p=Path('diagnostics/page.html')
          s=p.read_text(errors='ignore') if p.exists() else ''
          s=html.unescape(s)
          candidates=[]
          for pat in [r'"weblink_get"\s*:\s*\[?\{[^}]*?"url"\s*:\s*"([^"]+)', r'weblink_get.*?(https://[^"\\]+)', r'(https://cloclo[^"\\]+)']:
              candidates += re.findall(pat,s,re.S)
          candidates=[u.replace('\\/','/') for u in candidates]
          Path('diagnostics/candidates.txt').write_text('\n'.join(dict.fromkeys(candidates)))
          print('CANDIDATES:', candidates[:10])
          if candidates:
              direct=candidates[0].rstrip('/')+'/6ke2/7SxPnkT7F'
              Path('diagnostics/direct_url.txt').write_text(direct)
              print('DIRECT', direct)
          PY
          if [ -s diagnostics/direct_url.txt ]; then
            DIRECT=$(cat diagnostics/direct_url.txt)
            curl -k -L --compressed \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36' \
              -e "$URL" -b diagnostics/cookies.txt \
              -D diagnostics/download_headers.txt \
              -OJ --output-dir out "$DIRECT" || true
          fi
          find out diagnostics -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload downloaded archive
        uses: actions/upload-artifact@v4
        with:
          name: h5-interface-compiler-original
          path: out/*
          if-no-files-found: warn
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: h5-download-diagnostics
          path: diagnostics/*
          if-no-files-found: warn
