name: Temp Download H5 Compiler

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Extract High Five Mega link
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics out
          URL='https://maxcheaters.com/topic/235950-compiler-collection-for-interfaceu/'
          curl -k -L --compressed \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36' \
            -o diagnostics/maxcheaters.html "$URL"
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          s=html.unescape(Path('diagnostics/maxcheaters.html').read_text(errors='ignore'))
          urls=re.findall(r'https?://(?:www\.)?mega\.nz/[^\"\'<>\s]+',s)
          urls=[u.replace('&amp;','&') for u in urls]
          Path('diagnostics/mega_urls.txt').write_text('\n'.join(urls))
          for i,u in enumerate(urls): print(i,u)
          for m in re.finditer('High Five Compiler',s,re.I):
              Path('diagnostics/highfive_context.txt').write_text(s[max(0,m.start()-1500):m.start()+3000])
              break
          h5=[u for u in urls if 'vQ5ynKaZ' in u]
          if h5:
              Path('diagnostics/h5_mega_url.txt').write_text(h5[0])
              print('H5=',h5[0])
          PY
          cat diagnostics/h5_mega_url.txt || true
      - name: Download from Mega
        shell: bash
        continue-on-error: true
        run: |
          set -uxo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools
          if [ -s diagnostics/h5_mega_url.txt ]; then
            URL=$(cat diagnostics/h5_mega_url.txt)
            megadl --path out "$URL" || true
          fi
          find out diagnostics -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload downloaded archive
        uses: actions/upload-artifact@v4
        with:
          name: h5-interface-compiler-original
          path: out/*
          if-no-files-found: warn
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: h5-download-diagnostics
          path: diagnostics/*
          if-no-files-found: error
